name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Test Mac package
        run: swift test
      - name: Build iPad app
        run: |
          xcodebuild \
            -project iPadMirrorPad.xcodeproj \
            -scheme iPadMirrorPad \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
